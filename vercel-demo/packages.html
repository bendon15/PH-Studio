<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packages &amp; Pricing — PHStudio (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="siteHeader"></div>

<section class="page-hero">
  <div class="container"><span class="eyebrow">Investment</span><h1>Packages &amp; Pricing</h1>
  <div class="breadcrumb"><a href="index.html">Home</a> / Packages</div></div>
</section>

<section class="section">
  <div class="container">
    <div class="section-head center reveal" style="margin-left:auto;margin-right:auto;">
      <p>All packages include professional editing and a private online gallery. Need something custom? <a href="contact.html" style="color:var(--gold);">Get in touch</a> for a tailored quote.</p>
    </div>
    <div class="package-grid reveal" id="packageGrid"></div>
  </div>
</section>

<div id="siteFooter"></div>

<script src="js/mock-data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
window.BASE = '';
PHApp.renderHeader('packages');
PHApp.renderFooter();

document.getElementById('packageGrid').innerHTML = PHSTUDIO_SEED.packages.map(pkg => `
  <div class="package-card ${pkg.popular ? 'popular' : ''}">
    ${pkg.popular ? '<span class="popular-tag">Most Booked</span>' : ''}
    <span class="package-cat">${pkg.category}</span>
    <h3>${pkg.name}</h3>
    <div class="package-price">${PHApp.money(pkg.price)} <span>/ session</span></div>
    <ul class="package-list">${pkg.items.map(i => `<li>${i}</li>`).join('')}</ul>
    <a href="booking.html?package=${pkg.id}" class="btn btn-outline-dark btn-block">Select Package</a>
  </div>`).join('');
</script>
</body>
</html>
