<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Galleries — PHStudio (Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard">
<aside class="dash-sidebar" id="dashSidebar"></aside>
<main class="dash-main">
  <div class="dash-topbar"><div><h1>My Galleries</h1></div><a href="index.html" class="d-btn d-btn-outline d-btn-sm">View Public Site ↗</a></div>
  <div class="dash-content">
    <div class="panel">
      <div class="panel-head"><h3>Private Galleries</h3></div>
      <div id="galleriesWrap"></div>
    </div>
  </div>
</main>

<script src="js/mock-data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
<script>
window.BASE = '';
const user = PHApp.requireRole('client');
if (user) {
  PHApp.renderDashboardSidebar('galleries');
  const db = PHStore.load();
  const galleries = db.galleries.filter(g => g.client_id === user.id);
  const wrap = document.getElementById('galleriesWrap');
  if (!galleries.length) {
    wrap.innerHTML = `<div class="empty-state"><div class="icon">🖼️</div><p>No galleries have been published for you yet.</p></div>`;
  } else {
    wrap.innerHTML = `<div class="gallery-grid">${galleries.map(g => `
      <a href="gallery-view.html?id=${g.id}" class="gallery-photo" style="aspect-ratio:4/3;">
        <img src="${g.cover}" alt="${g.title}">
        <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,0.75),transparent 60%);display:flex;align-items:flex-end;padding:16px;">
          <div style="color:#fff;"><div style="font-weight:600;font-size:15px;">${g.title}</div><div style="font-size:12.5px;opacity:0.85;">${g.photos.length} photos</div></div>
        </div>
      </a>`).join('')}</div>`;
  }
}
</script>
</body>
</html>
